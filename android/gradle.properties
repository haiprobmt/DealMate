org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend base URL baked into BuildConfig.DEFAULT_BASE_URL (can be changed in-app in Settings).
# 10.0.2.2 is the host machine as seen from the Android emulator.
dealmate.baseUrl=http://10.0.2.2:8000/

# Optional Firebase Cloud Messaging config (all four must be set to enable push; see README).
# dealmate.firebase.projectId=
# dealmate.firebase.appId=
# dealmate.firebase.apiKey=
# dealmate.firebase.senderId=
