name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dealmate
          POSTGRES_PASSWORD: dealmate
          POSTGRES_DB: dealmate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealmate" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://dealmate:dealmate@localhost:5432/dealmate_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev,fcm]"
      - run: ruff check .
      - name: Unit + integration tests (PostgreSQL)
        run: pytest -q
      - name: Matching evaluation on the labelled dataset
        run: python -m scripts.eval_matching

  e2e:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack in demo mode
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-password/; s/^DEALMATE_BOOTSTRAP_TOKEN=.*/DEALMATE_BOOTSTRAP_TOKEN=ci-token-0123456789/' .env
          docker compose up -d --build --wait db api
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest httpx
      - name: End-to-end scenarios over HTTP
        env:
          DEALMATE_E2E_URL: http://localhost:8000
          DEALMATE_E2E_TOKEN: ci-token-0123456789
        run: pytest tests/e2e -q
      - if: failure()
        run: docker compose logs --tail 200

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, Robolectric UI and screenshot tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dealmate-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: android/app/build/reports
